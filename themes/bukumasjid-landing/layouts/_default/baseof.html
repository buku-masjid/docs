<!doctype html>
<html class="no-js" lang="id">
<head>
  <title>{{ .Title | default "Buku Masjid" }}</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="Buku Masjid - Solusi tata kelola keuangan masjid">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#fafafa">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

  <!-- Tabler -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />

  <!-- FONTS -->
  <link href="https://cdn.jsdelivr.net/gh/repalash/gilroy-free-webfont@fonts/Gilroy-Extrabold.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/repalash/gilroy-free-webfont@fonts/Gilroy-Light.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

  <!-- Animate -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

  <!-- Tailwind CSS (dipakai banyak halaman: team, cloud, mitra, donasi, dll) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Bukumasjid -->
  <link rel="stylesheet" href="/css/bukumasjid.css">
</head>
<body>
  {{ partial "nav-mobile.html" . }}
  {{ block "main" . }}{{ end }}
  <script type="text/javascript" src="/js/star.js"></script>
  <script>
    function addStarsToContainer() {
      const container = document.getElementById('starContainer');
      if (!container) return;
      staticStars(container);
    }
    function clearContainer() {
      const container = document.getElementById('starContainer');
      if (!container) return;
      container.innerHTML = '';
    }
    function addFallingStars() {
      const container = document.getElementById('starContainer');
      if (!container) return;
      fallingStars(container);
    }
    addStarsToContainer();
  </script>
</body>
</html>

{{ define "main" }}
  <section>
    <div class="bm-grad">
      <div class="d-none d-sm-block header px-4 py-3">
        <div class="row align-items-center position-relative">
          <div class="d-none d-lg-block col-lg-2 col-xl-3 position-absolute"><img src="/img/bm_logo_white.svg"></div>
          <div class="col position-relative text-center animate__animated animate__backInDown" style="top: 30px;">
            {{ partial "nav-desktop.html" . }}
          </div>
        </div>
      </div>
    </div>
  </section>
  <section class="grey-area">
    <div class="container-md py-5">
      <div class="row">
        <aside class="col-lg-3 mb-4">
          <div class="card border-0 shadow-sm">
            <div class="card-body">
              <ul class="list-unstyled mb-0">
                {{ range .CurrentSection.Pages }}
                <li class="py-1"><a href="{{ .RelPermalink }}" class="text-decoration-none">{{ .Title }}</a></li>
                {{ end }}
              </ul>
            </div>
          </div>
        </aside>
        <main class="col-lg-9">
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
              <li class="breadcrumb-item"><a href="{{ .CurrentSection.RelPermalink }}">{{ .CurrentSection.Title }}</a></li>
              <li class="breadcrumb-item active" aria-current="page">{{ .Title }}</li>
            </ol>
          </nav>
          <h1 class="display-4 heading txt-primary">{{ .Title }}</h1>
          {{ if .Description }}<p class="fs-5 text-muted">{{ .Description }}</p>{{ end }}
          <div class="content fs-5 mt-4">{{ .Content }}</div>
        </main>
      </div>
    </div>
  </section>
  {{ partial "footer.html" . }}
{{ end }}

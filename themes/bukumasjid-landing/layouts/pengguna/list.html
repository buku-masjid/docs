{{ define "main" }}
  <section>
    <div class="bm-grad">
      <div class="d-none d-sm-block header px-4 py-3">
        <div class="row position-relative align-items-center">
          <div class="d-none d-lg-block col-lg-2 col-xl-3 position-absolute"><img src="/img/bm_logo_white.svg"></div>
          <div class="col position-relative text-center animate__animated animate__backInDown" style="top: 30px;">
            {{ partial "nav-desktop.html" . }}
          </div>
        </div>
      </div>
    </div>
  </section>
  <section style="background: rgb(255,255,255);
background: linear-gradient(180deg, rgba(255,255,255,1) 5%, rgba(252,249,243,1) 30%, rgba(245,234,214,1) 49%, rgba(235,214,174,1) 83%);">
    <div class="container-md px-5 pt-5 mt-lg-5 position-relative">
      <div class="row row-cols-1 row-cols-md-2">
        <div class="display-3 heading txt-primary lh-1 col-lg pb-5" >
          Pengguna
          <br class="d-none d-md-block"><span class="txt-default">Buku Masjid</span>
        </div>
        <div class="col-lg text=center d-flex align-items-end">
          <img src="/img/masjid.svg" style="width:100%">
        </div>
      </div>
    </div>
  </section>
  <section>
    <div class="container-md px-5 pt-5 mt-lg-5 position-relative">
      <div class="row row-cards" data-masonry='{"percentPosition": true }'>
        {{ range .Site.Data.pengguna }}
        <div class="col-md-6 col-lg-3">
          <div class="card mb-4">
            <div class="card-body">
              <h5 class="card-title">{{ .nama }}</h5>
              <span class="badge rounded-pill bg-primary fw-light">{{ .kota }}</span>
            </div>
            <div class="card-footer lh-1">
              <a href="{{ .url }}" target="_blank" style="font-size:12px;"><i class="ti">&#xeade;</i> {{ .url }}</a>
            </div>
          </div>
        </div>
        {{ end }}
      </div>
      <div class="container-md text-center my-5 py-5">
        <div class="display-3 heading txt-primary lh-1"><span class="txt-default">Buku Masjid</span></div>
        <div class="pt-3 pb-4">Open-source MIT Licensed.</div>
        <div class="d-grid d-md-block">
          <a href="https://github.com/buku-masjid/buku-masjid" target="_blank"><button class="btn bg-secondary me-md-2 mb-2" type="button"><i class="ti">&#xec1c;</i> Source Code</button></a>
          <a href="https://demo.bukumasjid.com" target="_blank"><button class="btn bg-primary me-md-2 mb-2" type="button"><i class="ti">&#xea89;</i> Demo Buku Masjid</button></a>
          <a href="https://wa.me/6282350355470" target="_blank"><button class="btn bg-accent mb-2" type="button"><i class="ti">&#xeaed;</i> Hubungi Kami</button></a>
        </div>
      </div>
    </div>
  </section>
  {{ partial "footer.html" . }}
{{ end }}
